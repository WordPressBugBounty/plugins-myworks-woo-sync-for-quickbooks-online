name: Claude Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude-code-action:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Debug Event Information
        run: |
          echo "=== Event Debug Information ==="
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo ""
          echo "=== Comment/Body Content ==="
          echo "Issue comment body: ${{ github.event.comment.body }}"
          echo "Issue body: ${{ github.event.issue.body }}"
          echo "Review body: ${{ github.event.review.body }}"
          echo ""
          echo "=== Trigger Detection ==="
          echo "Contains @claude in comment: ${{ contains(github.event.comment.body, '@claude') }}"
          echo "Contains @claude in issue: ${{ contains(github.event.issue.body, '@claude') }}"
          echo "Contains @claude in review: ${{ contains(github.event.review.body, '@claude') }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude PR Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: "dev"
